spring.application.name=gestionImmobiliere

# Migrations de la base (Flyway) : schema uniquement par defaut, jamais de donnees de demonstration.
# Le seed (db/seed) n'est ajoute que par les profils dev et test, voir application-dev.properties.
# Le schema ne change que par un NOUVEAU fichier V<n>__description.sql : ne jamais modifier une migration deja appliquee.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false


# Format JSON stable des listes paginees : {"content":[...],"page":{"size","number",
# "totalElements","totalPages"}} au lieu de la serialisation brute de PageImpl.
spring.data.web.pageable.serialization-mode=via-dto

# Logging niveau DEBUG pour Spring Security et Web
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.web.cors=DEBUG
#logging.level.com.immobilier=DEBUG

# Afficher les détails des requêtes
