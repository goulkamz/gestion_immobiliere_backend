# Profil dev : en plus du schema, Flyway charge les donnees de demonstration (comptes de test, jeu de donnees).
# Migration repetable R__seed_dev.sql : executee apres toutes les migrations versionnees, une fois sur une base neuve,
# puis rejouee SEULEMENT si le fichier change (elle vide alors les donnees avant de les reinserer).
# Jamais en production : ne pas activer le profil dev ni ajouter classpath:db/seed aux locations.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
