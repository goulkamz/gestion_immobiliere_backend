services:
  postgres:
    image: postgres:15-alpine
    container_name: gestion-immo-postgres
    environment:
      POSTGRES_DB: gestion_immobiliere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./SystemImmo.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    networks:
      - immobiliere-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: immobiliere-redis
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - immobiliere-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: gestion-immo-redisinsight
    ports:
      - "5540:5540"
    networks:
      - immobiliere-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: gestion-immo-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - immobiliere-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gestion-immo-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - immobiliere-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: gestion-immo-backend
    ports:
      - "8080:8080"
    environment:
      # Profil
      - SPRING_PROFILES_ACTIVE=dev

      # PostgreSQL
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/gestion_immobiliere
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver

      # JPA
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_SHOW_SQL=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      - LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER=TRACE

      # JWT
      - JWT_SECRET_ACCESS=${JWT_SECRET_ACCESS}
      - JWT_SECRET_REFRESH=${JWT_SECRET_REFRESH}
      - FINGER_SECRET_KEY=${FINGER_SECRET_KEY}
      - JWT_ACCESS_EXPIRATION=900000
      - JWT_REFRESH_EXPIRATION=604800000
      - JWT_COOKIE_ACCESS_NAME=access_token
      - JWT_COOKIE_REFRESH_NAME=refresh_token
      - JWT_COOKIE_SECURE=true
      - JWT_COOKIE_SAME_SITE=Strict
      - JWT_REDIS_ENABLED=true

      - APP_BASE_URL=http://localhost:8080

      # Mail
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025
      - SPRING_MAIL_USERNAME=
      - SPRING_MAIL_PASSWORD=
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=false
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=false

      # Redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_DATABASE=0
      - SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE=20
      - SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE=10
      - SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE=2
      - SPRING_DATA_REDIS_TIMEOUT=5000
      - SPRING_DATA_REDIS_LETTUCE_SHUTDOWN_TIMEOUT=2000

      # Médias
      - APP_MEDIAS_STORAGE_PATH=/data/medias
      - APP_MEDIAS_MAX_SIZE_IMAGE_MO=5
      - APP_MEDIAS_MAX_SIZE_VIDEO_MO=50
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=60MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=60MB

      # MinIO
      - APP_MINIO_ENDPOINT=http://minio:9000
      - APP_MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - APP_MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - APP_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - APP_MINIO_BUCKET_MEDIAS=medias-immobilier
      - APP_MINIO_BUCKET_DOCUMENTS=documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped
    networks:
      - immobiliere-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio_data:
    driver: local

networks:
  immobiliere-network:
    driver: bridge